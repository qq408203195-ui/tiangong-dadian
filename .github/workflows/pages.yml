name: Publish encyclopedia
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate master data
        run: python3 scripts/validate.py
      - name: Validate data kernel and run tests
        run: |
          python3 scripts/validate_snapshot.py
          python3 scripts/validate_kernel.py
          python3 -m unittest discover -s tests -v
      - name: Generate status from validated repository
        env:
          TIANGONG_TESTS_PASSED: '1'
        run: python3 scripts/build_status.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
